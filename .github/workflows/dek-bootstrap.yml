name: DEK Bootstrap Ceremony

on:
  workflow_dispatch:
    inputs:
      kek_vault_url:
        required: true
        type: string
      kek_name:
        required: true
        type: string
      secret_vault_url:
        required: true
        type: string
      secret_name:
        required: true
        type: string
        
permissions:
  id-token: write   # requerido para OIDC
  contents: read

jobs:
  generate-and-wrap-dek:
    runs-on: ubuntu-latest
    environment: dek-bootstrap   # dispara el gate de aprobación
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install SDK
        run: pip install azure-identity azure-keyvault-keys azure-keyvault-secrets

      - name: Generate, wrap, and store DEK
        env:
          KEK_VAULT_URL: ${{ inputs.kek_vault_url }}
          KEK_NAME: ${{ inputs.kek_name }}
          SECRET_VAULT_URL: ${{ inputs.secret_vault_url }}
          SECRET_NAME: ${{ inputs.secret_name }}
        run: python scripts/dek_bootstrap.py

      - name: Verify wrapped DEK integrity
        env:
          KEK_VAULT_URL: ${{ inputs.kek_vault_url }}
          KEK_NAME: ${{ inputs.kek_name }}
          SECRET_VAULT_URL: ${{ inputs.secret_vault_url }}
          SECRET_NAME: ${{ inputs.secret_name }}
        run: python scripts/verify_dek.py
