name: 🔑 DEK Bootstrap Ceremony

on:
  workflow_dispatch:
    inputs:
      kek_vault_url:
        required: true
        type: string
      kek_name:
        required: true
        type: string
      secret_vault_url:
        required: true
        type: string
      secret_name:
        required: true
        type: string
      plan_only:
        type: boolean
        required: false
        default: false
      use_pinned_openssl:
        description: "true = compilar OpenSSL desde fuente (version pinneada + SHA256); false = usar el OpenSSL del runner (mantenido por Canonical)"
        type: boolean
        required: false
        default: true
        
permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    outputs:
      teams: ${{ steps.actorTeams.outputs.teams }}
    steps:
      - name: Get Teams from the Actor
        uses: tspascoal/get-user-teams-membership@v2
        id: actorTeams
        with:
          username: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT_READ_ORG }}
  
  generate-and-wrap-dek:
    name: DEK Ceremony
    needs: validation
    if: github.ref == 'refs/heads/main' &&  (contains(needs.validation.outputs.teams, 'gh-squad-dlco'))
    runs-on: ubuntu-latest
    env:
      # Actualizar version y SHA256 desde https://www.openssl.org/source/
      OPENSSL_VERSION: "3.5.7"
      OPENSSL_SHA256: "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8"
      OPENSSL_INSTALL_DIR: "/opt/openssl"
    steps:
      - uses: actions/checkout@v5

      - name: Build and install pinned OpenSSL
        if: ${{ inputs.use_pinned_openssl == true }}
        run: |
          sudo apt-get install -y --no-install-recommends build-essential perl
          cd /tmp
          curl -fsSL "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" \
            -o "openssl-${OPENSSL_VERSION}.tar.gz"
          echo "${OPENSSL_SHA256}  openssl-${OPENSSL_VERSION}.tar.gz" | sha256sum --check --strict
          tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure --prefix="${OPENSSL_INSTALL_DIR}" --openssldir="${OPENSSL_INSTALL_DIR}/etc/ssl" \
            no-shared enable-ec_nistp_64_gcc_128
          make -j"$(nproc)"
          sudo make install_sw
          echo "${OPENSSL_INSTALL_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Verify pinned OpenSSL
        if: ${{ inputs.use_pinned_openssl == true }}
        run: |
          openssl version
          openssl version | grep -F "${OPENSSL_VERSION}" || \
            { echo "ERROR: OpenSSL version mismatch"; exit 1; }

      - name: Verify system OpenSSL (runner-managed)
        if: ${{ inputs.use_pinned_openssl == false }}
        run: |
          echo "ADVERTENCIA: usando OpenSSL del runner. Version reportada:"
          openssl version

      - name: Install SDK
        run: pip install azure-identity azure-keyvault-keys azure-keyvault-secrets

      - name: Check Azure credentials (plan only)
        if: ${{ inputs.plan_only == true }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_SP }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET_SP }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          KEK_VAULT_URL: ${{ inputs.kek_vault_url }}
          KEK_NAME: ${{ inputs.kek_name }}
          SECRET_VAULT_URL: ${{ inputs.secret_vault_url }}
          SECRET_NAME: ${{ inputs.secret_name }}
        run: python scripts/check_auth.py
        
      - name: Generate, wrap, and store DEK
        if: ${{ inputs.plan_only == false }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_SP }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET_SP }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          KEK_VAULT_URL: ${{ inputs.kek_vault_url }}
          KEK_NAME: ${{ inputs.kek_name }}
          SECRET_VAULT_URL: ${{ inputs.secret_vault_url }}
          SECRET_NAME: ${{ inputs.secret_name }}
        run: python scripts/dek_bootstrap.py

      - name: Verify wrapped DEK integrity
        if: ${{ inputs.plan_only == false }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_SP }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET_SP }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          KEK_VAULT_URL: ${{ inputs.kek_vault_url }}
          KEK_NAME: ${{ inputs.kek_name }}
          SECRET_VAULT_URL: ${{ inputs.secret_vault_url }}
          SECRET_NAME: ${{ inputs.secret_name }}
        run: python scripts/verify_dek.py

        